name: Gerar ZIP privado

on:
  workflow_call:
    inputs:
      pasta_origem:
        description: "Pasta do projeto no repositório que chamou este workflow"
        required: true
        type: string
      nome_zip:
        description: "Nome do ZIP, sem .zip"
        required: true
        type: string

permissions:
  contents: read

jobs:
  compactar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório que solicitou a compactação
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar e compactar projeto
        env:
          PASTA: ${{ inputs.pasta_origem }}
          NOME_ZIP: ${{ inputs.nome_zip }}
        run: |
          set -euo pipefail
          if [[ ! "$PASTA" =~ ^[a-zA-Z0-9_./-]+$ ]] || [[ "$PASTA" == /* ]] || [[ "$PASTA" == *".."* ]]; then
            echo "Caminho de pasta inválido."
            exit 1
          fi
          if [[ ! "$NOME_ZIP" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Nome do ZIP inválido."
            exit 1
          fi
          test -d "$PASTA"
          test -s "$PASTA/index.html"
          mkdir -p dist
          (cd "$PASTA" && zip -qr "$GITHUB_WORKSPACE/dist/$NOME_ZIP.zip" .)
          test -s "dist/$NOME_ZIP.zip"
          echo "ZIP gerado:"
          ls -lh "dist/$NOME_ZIP.zip"

      - name: Disponibilizar ZIP no repositório chamador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.nome_zip }}
          path: dist/${{ inputs.nome_zip }}.zip
          if-no-files-found: error
          retention-days: 7
